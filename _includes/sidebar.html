<a class="skip-link" href="#main-content">Skip to content</a>
<button class="hamburger" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false" onclick="toggleSidebar()">
  <span></span>
</button>
<button class="darkmode-toggle" aria-label="Toggle dark mode" onclick="toggleDarkMode()">
  🌓
</button>
<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
<aside class="sidebar" id="sidebar" aria-label="Section navigation">
  <img src="/profile.jpg" class="profile-img" alt="Portrait of Ashikuzzaman">
  <nav>
    <a href="/#about">About</a>
    <a href="/#research">Research</a>
    <a href="/#publications">Publications</a>
    <a href="/#experience">Experience</a>
    <a href="/#skills">Skills</a>
    <a href="/#education">Education</a>
    <a href="/#service">Service</a>
    <a href="/#contact">Contact</a>
  </nav>
</aside>
<script>
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  const burger = document.querySelector('.hamburger');
  const isOpen = sidebar.classList.toggle('open');
  overlay.classList.toggle('active', isOpen);
  document.body.classList.toggle('sidebar-open', isOpen);
  burger.setAttribute('aria-expanded', String(isOpen));
}

function toggleDarkMode() {
  document.body.classList.toggle('dark-mode');
  localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
}

document.addEventListener('DOMContentLoaded', function() {
  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark-mode');
  }

  const links = document.querySelectorAll('.sidebar nav a');
  links.forEach(function(link) {
    link.addEventListener('click', function() {
      if (window.innerWidth < 800) {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebar-overlay').classList.remove('active');
        document.body.classList.remove('sidebar-open');
        document.querySelector('.hamburger').setAttribute('aria-expanded', 'false');
      }
    });
  });
});
</script>
